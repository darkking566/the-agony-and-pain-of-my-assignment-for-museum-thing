<body data-page="exhibit">
<div id="site-nav"></div>

<section class="band page-head dark"><div class="wrap">
  <p class="eyebrow">主展區</p>
  <h1>行動電話時間軸</h1>
  <p class="sub">從 1940 年代到 2020 年代，選一個年代，點展品翻面看介紹。想要身歷其境，就切到 3D 展廳。</p>
</div></section>
<section class="band" id="exhibit-top"><div class="wrap" style="padding-block:40px 80px">
  <div class="exhibit-bar">
    <div class="mode-switch" role="tablist" aria-label="參觀模式">
      <button role="tab" id="tab-2d" aria-selected="true" aria-controls="panel-2d">平面時間軸</button>
      <button role="tab" id="tab-3d" aria-selected="false" aria-controls="panel-3d">3D 展廳</button>
    </div>
    <div class="filters">
      <input type="search" id="search" placeholder="搜尋手機、年份或關鍵字" aria-label="搜尋展品" autocomplete="off">
      <label class="chip-toggle" for="core-only"><input type="checkbox" id="core-only"> 只看核心展品</label>
    </div>
  </div>
  <div id="panel-2d" role="tabpanel" aria-labelledby="tab-2d">
    <div class="era-rail" id="era-rail" role="tablist" aria-label="年代"></div>
    <div class="era-panel" id="era-panel"></div>
    <div id="search-results" hidden></div>
  </div>
  <div id="panel-3d" role="tabpanel" aria-labelledby="tab-3d" hidden>
    <div class="hall" id="hall">
      <div class="hall-canvas" id="hall-canvas"></div>
      <div class="hall-loading" id="hall-loading"><div class="hall-skel"><span class="hs-phone"></span><span class="hs-bar"><i></i></span><p>展廳載入中…</p></div></div>
      <div class="hall-count" id="hall-count" aria-live="polite"></div>
      <div class="hall-hint">拖曳旋轉 · 雙指縮放 · 點按鍵、螢幕和圓點試試看 · 點發光展台進入沉浸體驗</div>
      <button class="hall-nav prev" id="hall-prev" aria-label="上一件展品">‹</button>
      <button class="hall-nav next" id="hall-next" aria-label="下一件展品">›</button>
      <div class="hall-info" id="hall-info"></div>
    </div>
    <div class="hall-strip" id="hall-strip" role="group" aria-label="用年份跳到展品"></div>
  </div>
</div></section>
<div id="site-footer"></div>
