  <h1>資料核對表</h1>
  <p class="sub">展品與場景裡的數字，哪些已經找到出處、哪些各來源說法不一、哪些還沒查證。口頭報告前先看這一頁。</p>

<section class="band alt"><div class="wrap">
  <ul class="fact-legend">
    <li><span class="st ok">已核對</span>找到至少一個可靠出處，說法一致</li>
    <li><span class="st diff">說法不一</span>找到出處，但各來源數字或用詞有差異，附建議寫法</li>
    <li><span class="st todo">待查證</span>本次沒有找到出處，報告時請避免說得太肯定</li>
  </ul>
  <p class="fine" style="margin-top:0">核對日期：2026 年 11 月。出處多為百科、媒體與愛好者資料庫，不是廠商原始文件；要引用到報告裡，建議再回到原始新聞稿或官方網站確認。</p>
